<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<title>Crow Avatar Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#090c12;color:#eef3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
.app{max-width:900px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:2px 0 4px}
p{line-height:1.5;color:#c8d0df;margin:6px 0 12px}
.panel{background:#141a25;border:1px solid #ffffff18;border-radius:18px;padding:12px;margin-top:12px}
.stage{height:min(66dvh,660px);min-height:390px;border-radius:20px;overflow:hidden;position:relative;
background:radial-gradient(circle at 50% 18%,#34425a 0%,#18202d 42%,#090d14 100%)}
.badge{position:absolute;z-index:20;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:#080b11cc;font-size:12px}
#avatarWrap{position:absolute;inset:0;display:grid;place-items:center;perspective:850px}
#avatar{width:min(96vw,600px);max-height:94%;object-fit:contain;filter:drop-shadow(0 20px 28px #0008);
transform-origin:50% 58%;will-change:transform;transition:filter .15s}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{border:0;border-radius:999px;padding:12px 15px;font-size:14px;font-weight:800;background:#2b3242;color:#eef3ff}
button.on{background:#61e2a0;color:#08150d}
button.warn{background:#6f3d3d}
button:disabled{opacity:.45}
.row{display:grid;grid-template-columns:78px 1fr 48px;gap:8px;align-items:center;margin:9px 0}
input[type=range]{width:100%}
#status{font-size:12px;line-height:1.55;background:#0c111a;border-radius:12px;padding:10px;margin-top:10px;white-space:pre-wrap}
#video{position:fixed;right:10px;bottom:10px;width:105px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;
transform:scaleX(-1);z-index:50;border:1px solid #ffffff22;background:#000}
.small{font-size:12px;color:#aab5c9}
.kbd{display:inline-block;padding:2px 7px;border-radius:7px;background:#252c3b}
</style>
</head>
<body>
<div class="app">
  <h1>カラス・簡易2Dアバター実験</h1>
  <p>生成画像を4状態にそろえて、軽い首振り・まばたき・口パク・舌出しを切り替える実験版。</p>

  <div class="stage">
    <div class="badge">2D / crow / v0.2</div>
    <div id="avatarWrap">
      <img id="avatar" alt="カラスの2Dアバター">
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <button id="autoBtn" class="on">自動デモ ON</button>
      <button data-state="neutral">通常</button>
      <button data-state="blink">まばたき</button>
      <button data-state="talk">口を開く</button>
      <button data-state="tongue">舌を出す</button>
      <button id="cameraBtn">カメラ OFF</button>
    </div>

    <div class="row"><label>横向き</label><input id="yaw" type="range" min="-1" max="1" step=".01" value="0"><span id="yawV">0.00</span></div>
    <div class="row"><label>上下</label><input id="pitch" type="range" min="-1" max="1" step=".01" value="0"><span id="pitchV">0.00</span></div>
    <div class="row"><label>傾き</label><input id="roll" type="range" min="-1" max="1" step=".01" value="0"><span id="rollV">0.00</span></div>

    <div id="status">自動デモ中。GitHub Pages の HTTPS 上では「カメラ OFF」から顔トラッキングも試せます。</div>
    <p class="small">舌は自動デモでは時々出ます。カメラ時は Face Landmarker に <span class="kbd">tongueOut</span> があれば使用し、無い環境では手動ボタンで出します。</p>
  </div>
</div>

const avatar = document.getElementById('avatar');
const autoBtn = document.getElementById('autoBtn');
const cameraBtn = document.getElementById('cameraBtn');
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const yawEl = document.getElementById('yaw'), pitchEl = document.getElementById('pitch'), rollEl = document.getElementById('roll');
const yawV = document.getElementById('yawV'), pitchV = document.getElementById('pitchV'), rollV = document.getElementById('rollV');

let auto = true, cameraMode = false, stream = null, landmarker = null, lastVideoTime = -1;
let currentState = 'neutral';
let smooth = {yaw:0,pitch:0,roll:0,jaw:0,blink:0,smile:0,tongue:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function setState(s){
  currentState=s;
  avatar.src=IMG[s] || IMG.neutral;
}
setState('neutral');

function setPose(yaw,pitch,roll){
  yawEl.value=yaw.toFixed(2); pitchEl.value=pitch.toFixed(2); rollEl.value=roll.toFixed(2);
  yawV.textContent=yaw.toFixed(2); pitchV.textContent=pitch.toFixed(2); rollV.textContent=roll.toFixed(2);
  avatar.style.transform=`rotateY(${yaw*10}deg) rotateX(${pitch*6}deg) rotateZ(${roll*5}deg) translateX(${yaw*5}px) translateY(${-pitch*4}px)`;
}

function toggleAuto(v){
  auto = v ?? !auto;
  if(auto) cameraMode=false;
  autoBtn.textContent=auto?'自動デモ ON':'自動デモ OFF';
  autoBtn.className=auto?'on':'';
}

document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{
  toggleAuto(false);
  setState(b.dataset.state);
}));
autoBtn.addEventListener('click',()=>{
  if(cameraMode) stopCamera();
  toggleAuto();
});

[yawEl,pitchEl,rollEl].forEach(el=>el.addEventListener('input',()=>{
  toggleAuto(false);
  setPose(+yawEl.value,+pitchEl.value,+rollEl.value);
}));

function demo(now){
  const t=now/1000;
  setPose(Math.sin(t*.72)*.42, Math.sin(t*.39+.8)*.14, Math.sin(t*.56)*.10);
  // Short blink pulses, regular talking, occasional tongue.
  const blink = (Math.sin(t*3.15)>.975 || Math.sin(t*2.02+1.8)>.994);
  const tongueWindow = (t % 11.0) > 9.7 && (t % 11.0) < 10.5;
  const talking = Math.sin(t*2.7) > -0.05;
  if(tongueWindow) setState('tongue');
  else if(blink) setState('blink');
  else if(talking) setState('talk');
  else setState('neutral');
}

function blendMap(result){
  const m={};
  for(const c of result?.faceBlendshapes?.[0]?.categories||[]) m[c.categoryName]=c.score;
  return m;
}
function derive(result){
  const pts=result?.faceLandmarks?.[0], b=blendMap(result);
  if(!pts) return null;
  const nose=pts[1], chin=pts[152], forehead=pts[10], le=pts[234], re=pts[454], eoL=pts[33], eoR=pts[263];
  const fw=Math.max(.001,Math.abs(re.x-le.x)), fh=Math.max(.001,Math.abs(chin.y-forehead.y)), mid=(le.x+re.x)/2;
  return {
    yaw:clamp((mid-nose.x)/fw*4.4,-1,1),
    pitch:clamp(((forehead.y+fh*.48)-nose.y)/fh*4.5,-1,1),
    roll:clamp(Math.atan2(eoR.y-eoL.y,eoR.x-eoL.x)*1.7,-.8,.8),
    jaw:clamp((b.jawOpen||0)*1.3,0,1),
    blink:clamp(Math.max(b.eyeBlinkLeft||0,b.eyeBlinkRight||0)*1.25,0,1),
    smile:clamp(((b.mouthSmileLeft||0)+(b.mouthSmileRight||0))*.7,0,1),
    tongue:clamp(b.tongueOut||0,0,1)
  };
}
function applyFace(p){
  const k=.25;
  for(const key of Object.keys(smooth)) smooth[key]=lerp(smooth[key],p[key]||0,k);
  setPose(smooth.yaw,smooth.pitch,smooth.roll);
  if(smooth.tongue>.45) setState('tongue');
  else if(smooth.blink>.6) setState('blink');
  else if(smooth.jaw>.28) setState('talk');
  else setState('neutral');
}

async function ensureLandmarker(){
  if(landmarker) return true;
  statusEl.textContent='顔認識モデルを読み込み中…';
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');
    const vision=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
    landmarker=await mod.FaceLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
      runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true
    });
    return true;
  }catch(e){
    console.error(e);
    statusEl.textContent='MediaPipe の読み込みに失敗しました。自動デモはそのまま使えます。';
    return false;
  }
}

async function startCamera(){
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    statusEl.textContent='カメラは HTTPS のWebページで開く必要があります。GitHub Pages 公開後に再試行してください。';
    cameraBtn.className='warn';
    return;
  }
  if(!(await ensureLandmarker())) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}}});
    video.srcObject=stream; video.hidden=false; await video.play();
    auto=false; cameraMode=true;
    autoBtn.textContent='自動デモ OFF'; autoBtn.className='';
    cameraBtn.textContent='カメラ ON'; cameraBtn.className='on';
    statusEl.textContent='顔トラッキング中：首・まばたき・口を反映します。舌検出が無い端末では「舌を出す」ボタンを使ってください。';
  }catch(e){
    console.error(e);
    statusEl.textContent='カメラを開始できませんでした。ブラウザのカメラ権限を確認してください。';
    cameraBtn.className='warn';
  }
}
function stopCamera(){
  cameraMode=false;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null; video.hidden=true;
  cameraBtn.textContent='カメラ OFF'; cameraBtn.className='';
}

cameraBtn.addEventListener('click',()=>cameraMode?stopCamera():startCamera());

function loop(now){
  if(auto) demo(now);
  else if(cameraMode && landmarker && video.readyState>=2 && video.currentTime!==lastVideoTime){
    const r=landmarker.detectForVideo(video,now);
    const p=derive(r);
    if(p) applyFace(p);
    else statusEl.textContent='顔を探しています…';
    lastVideoTime=video.currentTime;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
