<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Crow Avatar Lab v0.3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#090c12;color:#eef3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
.app{max-width:900px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:2px 0 4px}
p{line-height:1.5;color:#c8d0df;margin:6px 0 12px}
.panel{background:#141a25;border:1px solid #ffffff18;border-radius:18px;padding:12px;margin-top:12px}
.stage{height:min(66dvh,660px);min-height:390px;border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 18%,#34425a 0%,#18202d 42%,#090d14 100%)}
.badge{position:absolute;z-index:20;left:10px;top:10px;padding:6px 10px;border-radius:999px;background:#080b11dd;font-size:12px}
#avatarWrap{position:absolute;inset:0;display:grid;place-items:center;perspective:900px}
.avatarImg{position:absolute;width:min(96vw,600px);max-height:94%;object-fit:contain;filter:drop-shadow(0 20px 28px #0008);will-change:transform}
#bodyAvatar{clip-path:inset(56% 0 0 0);transform-origin:50% 72%;animation:breathe 4.4s ease-in-out infinite}
#headAvatar{clip-path:inset(0 0 29% 0);transform-origin:50% 57%;z-index:3}
@keyframes breathe{
  0%,100%{transform:translateY(1px) scaleX(1) scaleY(1)}
  50%{transform:translateY(0) scaleX(1.004) scaleY(1.008)}
}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{border:0;border-radius:999px;padding:12px 15px;font-size:14px;font-weight:800;background:#2b3242;color:#eef3ff}
button.on{background:#61e2a0;color:#08150d}
button.warn{background:#763f45;color:#fff}
button.busy{background:#665b2b;color:#fff4b0}
.row{display:grid;grid-template-columns:78px 1fr 48px;gap:8px;align-items:center;margin:9px 0}
input[type=range]{width:100%}
#status{font-size:12px;line-height:1.55;background:#0c111a;border-radius:12px;padding:10px;margin-top:10px;white-space:pre-wrap}
#diag{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#293142}
.chip.ok{background:#17402c}.chip.bad{background:#582b31}.chip.wait{background:#4b4424}
#video{position:fixed;right:10px;bottom:10px;width:105px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;transform:scaleX(-1);z-index:50;border:1px solid #ffffff22;background:#000}
.small{font-size:12px;color:#aab5c9}
</style>
</head>
<body>
<div class="app">
  <h1>カラス・簡易2Dアバター実験</h1>
  <p>頭だけを軽く動かし、体は小さな呼吸だけ。まばたきと口パクを切り替える v0.3。</p>

  <div class="stage">
    <div class="badge">2D / crow / v0.3.1</div>
    <div id="avatarWrap">
      <img id="bodyAvatar" class="avatarImg" alt="">
      <img id="headAvatar" class="avatarImg" alt="カラスの2Dアバター">
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <button id="autoBtn" class="on">自動デモ ON</button>
      <button data-state="neutral">通常</button>
      <button data-state="blink">まばたき</button>
      <button data-state="talk">口を開く</button>
      <button id="cameraBtn">カメラ OFF</button>
    </div>

    <div class="row"><label>横向き</label><input id="yaw" type="range" min="-1" max="1" step=".01" value="0"><span id="yawV">0.00</span></div>
    <div class="row"><label>上下</label><input id="pitch" type="range" min="-1" max="1" step=".01" value="0"><span id="pitchV">0.00</span></div>
    <div class="row"><label>傾き</label><input id="roll" type="range" min="-1" max="1" step=".01" value="0"><span id="rollV">0.00</span></div>

    <div id="status">自動デモ中。頭だけが動き、体は呼吸だけします。</div>
    <div id="diag">
      <span id="secureChip" class="chip wait">HTTPS: 判定中</span>
      <span id="cameraChip" class="chip wait">Camera API: 判定中</span>
      <span id="modelChip" class="chip wait">顔認識: 未読込</span>
      <span id="faceChip" class="chip wait">顔: 未検出</span>
    </div>
    <p class="small">カメラON後、右下に自分の映像が出ればカメラ取得は成功。さらに「顔: 検出中」になれば顔トラッキングまで動いています。</p>
  </div>
</div>

const bodyAvatar=document.getElementById('bodyAvatar');
const headAvatar=document.getElementById('headAvatar');
const autoBtn=document.getElementById('autoBtn');
const cameraBtn=document.getElementById('cameraBtn');
const statusEl=document.getElementById('status');
const video=document.getElementById('video');
const secureChip=document.getElementById('secureChip');
const cameraChip=document.getElementById('cameraChip');
const modelChip=document.getElementById('modelChip');
const faceChip=document.getElementById('faceChip');
const yawEl=document.getElementById('yaw'), pitchEl=document.getElementById('pitch'), rollEl=document.getElementById('roll');
const yawV=document.getElementById('yawV'), pitchV=document.getElementById('pitchV'), rollV=document.getElementById('rollV');

let auto=true, cameraMode=false, stream=null, landmarker=null, lastVideoTime=-1, lastStatusTime=0;
let currentState='neutral';
let smooth={yaw:0,pitch:0,roll:0,jaw:0,blink:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

bodyAvatar.src=IMG.neutral;
headAvatar.src=IMG.neutral;

function chip(el,text,kind){el.textContent=text;el.className='chip '+kind}
chip(secureChip,'HTTPS: '+(window.isSecureContext?'OK':'NG'),window.isSecureContext?'ok':'bad');
const hasCameraAPI=!!navigator.mediaDevices?.getUserMedia;
chip(cameraChip,'Camera API: '+(hasCameraAPI?'OK':'NG'),hasCameraAPI?'ok':'bad');

function setState(s){
  if(currentState===s)return;
  currentState=s;
  headAvatar.src=IMG[s]||IMG.neutral;
}

function setPose(yaw,pitch,roll){
  yaw=clamp(yaw,-1,1); pitch=clamp(pitch,-1,1); roll=clamp(roll,-1,1);
  yawEl.value=yaw.toFixed(2); pitchEl.value=pitch.toFixed(2); rollEl.value=roll.toFixed(2);
  yawV.textContent=yaw.toFixed(2); pitchV.textContent=pitch.toFixed(2); rollV.textContent=roll.toFixed(2);
  // 全身ではなく頭だけ。横向きは小さめ、上下と傾きも頭だけに適用。
  headAvatar.style.transform=`translateX(${yaw*7}px) translateY(${pitch*8}px) rotateY(${yaw*11}deg) rotateX(${-pitch*7}deg) rotateZ(${roll*7}deg)`;
}

function toggleAuto(v){
  auto=v??!auto;
  if(auto&&cameraMode)stopCamera();
  autoBtn.textContent=auto?'自動デモ ON':'自動デモ OFF';
  autoBtn.className=auto?'on':'';
}

document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{
  toggleAuto(false);
  setState(b.dataset.state);
}));
autoBtn.addEventListener('click',()=>toggleAuto());

[yawEl,pitchEl,rollEl].forEach(el=>el.addEventListener('input',()=>{
  toggleAuto(false);
  setPose(+yawEl.value,+pitchEl.value,+rollEl.value);
}));

function demo(now){
  const t=now/1000;
  setPose(Math.sin(t*.62)*.34,Math.sin(t*.37+.8)*.16,Math.sin(t*.51)*.10);
  const blink=(Math.sin(t*3.0)>.978||Math.sin(t*1.91+1.8)>.995);
  const talking=Math.sin(t*2.55)>0.03;
  if(blink)setState('blink');
  else if(talking)setState('talk');
  else setState('neutral');
}

function blendMap(result){
  const m={};
  for(const c of result?.faceBlendshapes?.[0]?.categories||[])m[c.categoryName]=c.score;
  return m;
}

function derive(result){
  const pts=result?.faceLandmarks?.[0],b=blendMap(result);
  if(!pts)return null;

  const nose=pts[1],chin=pts[152],forehead=pts[10];
  const leftFace=pts[234],rightFace=pts[454];
  const leftEye=pts[33],rightEye=pts[263];
  const fw=Math.max(.001,Math.abs(rightFace.x-leftFace.x));
  const fh=Math.max(.001,Math.abs(chin.y-forehead.y));
  const faceMidX=(leftFace.x+rightFace.x)/2;
  const eyeMidY=(leftEye.y+rightEye.y)/2;

  // 左右：鼻が顔中心からどれだけずれたか。
  const yaw=clamp((faceMidX-nose.x)/fw*4.8,-1,1);

  // 上下：鼻の高さを「目〜顎」の比率で見る。ニュートラル付近を0にする。
  const eyeChin=Math.max(.001,chin.y-eyeMidY);
  const noseRatio=(nose.y-eyeMidY)/eyeChin;
  const pitch=clamp((noseRatio-.43)*4.5,-1,1);

  // 傾き：両目を結ぶ線の角度。
  const roll=clamp(Math.atan2(rightEye.y-leftEye.y,rightEye.x-leftEye.x)*1.75,-.8,.8);

  return{
    yaw,pitch,roll,
    jaw:clamp((b.jawOpen||0)*1.4,0,1),
    blink:clamp(Math.max(b.eyeBlinkLeft||0,b.eyeBlinkRight||0)*1.25,0,1)
  };
}

function applyFace(p,now){
  const k=.28;
  for(const key of Object.keys(smooth))smooth[key]=lerp(smooth[key],p[key]||0,k);
  setPose(smooth.yaw,smooth.pitch,smooth.roll);
  if(smooth.blink>.62)setState('blink');
  else if(smooth.jaw>.23)setState('talk');
  else setState('neutral');

  if(now-lastStatusTime>350){
    statusEl.textContent=`顔トラッキング中  横:${smooth.yaw.toFixed(2)}  上下:${smooth.pitch.toFixed(2)}  傾き:${smooth.roll.toFixed(2)}  口:${smooth.jaw.toFixed(2)}`;
    lastStatusTime=now;
  }
}

async function ensureLandmarker(){
  if(landmarker)return true;
  chip(modelChip,'顔認識: SDK読込中','wait');
  statusEl.textContent='MediaPipe本体を読み込み中…';

  let mp=null;
  let lastErr=null;
  const sdkUrls=[
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js',
    'https://unpkg.com/@mediapipe/tasks-vision@0.10.22/vision_bundle.js?module'
  ];

  for(const url of sdkUrls){
    try{
      const mod=await import(url);
      mp=mod.default||mod;
      if((mp.FilesetResolver||mod.FilesetResolver)&&(mp.FaceLandmarker||mod.FaceLandmarker)){
        mp={FilesetResolver:mp.FilesetResolver||mod.FilesetResolver,FaceLandmarker:mp.FaceLandmarker||mod.FaceLandmarker};
        break;
      }
    }catch(e){
      console.warn('MediaPipe SDK load failed:',url,e);
      lastErr=e;
    }
  }

  if(!mp){
    chip(modelChip,'顔認識: SDK失敗','bad');
    statusEl.textContent='MediaPipe本体を読み込めませんでした。通信/CDN読み込みで止まっています。\n'+(lastErr?.message||'');
    return false;
  }

  try{
    chip(modelChip,'顔認識: WASM読込中','wait');
    statusEl.textContent='顔認識エンジン(WASM)を読み込み中…';
    const vision=await mp.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
    );

    chip(modelChip,'顔認識: モデル読込中','wait');
    statusEl.textContent='顔の学習済みモデルを読み込み中…';
    landmarker=await mp.FaceLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
      },
      runningMode:'VIDEO',
      numFaces:1,
      outputFaceBlendshapes:true,
      minFaceDetectionConfidence:0.5,
      minFacePresenceConfidence:0.5,
      minTrackingConfidence:0.5
    });
    chip(modelChip,'顔認識: OK','ok');
    return true;
  }catch(e){
    console.error(e);
    chip(modelChip,'顔認識: モデル失敗','bad');
    statusEl.textContent='MediaPipe本体は読めましたが、WASM/顔モデルの初期化で失敗しました。\n'+(e?.message||'');
    return false;
  }
}

async function startCamera(){
  cameraBtn.textContent='カメラ起動中…';
  cameraBtn.className='busy';

  if(!window.isSecureContext||!hasCameraAPI){
    cameraBtn.textContent='カメラ NG';
    cameraBtn.className='warn';
    statusEl.textContent=!window.isSecureContext?'HTTPSではないためカメラを使えません。GitHub PagesのURLで開いてください。':'このブラウザではカメラAPIが利用できません。';
    return;
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:'user'},width:{ideal:720},height:{ideal:1280}}
    });
    video.srcObject=stream;
    video.hidden=false;
    await video.play();
    chip(cameraChip,'Camera: 映像OK','ok');
    statusEl.textContent='カメラ映像OK。顔認識を準備しています…';

    if(!(await ensureLandmarker())){
      stopCamera(false);
      return;
    }

    auto=false;
    cameraMode=true;
    autoBtn.textContent='自動デモ OFF';
    autoBtn.className='';
    cameraBtn.textContent='カメラ ON';
    cameraBtn.className='on';
    faceChip.textContent='顔: 探しています';
    faceChip.className='chip wait';
    statusEl.textContent='カメラON。顔を正面に入れてください。右下の映像が見えていればカメラ取得は成功しています。';
  }catch(e){
    console.error(e);
    cameraBtn.textContent='カメラ NG';
    cameraBtn.className='warn';
    chip(cameraChip,'Camera: 失敗','bad');
    statusEl.textContent='カメラを開始できませんでした。Chromeのサイト設定で、このページのカメラ権限が「許可」になっているか確認してください。';
  }
}

function stopCamera(resetLabel=true){
  cameraMode=false;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  video.srcObject=null;
  video.hidden=true;
  chip(faceChip,'顔: 未検出','wait');
  if(resetLabel){
    cameraBtn.textContent='カメラ OFF';
    cameraBtn.className='';
  }
}

cameraBtn.addEventListener('click',()=>cameraMode?stopCamera():startCamera());

function loop(now){
  if(auto)demo(now);
  else if(cameraMode&&landmarker&&video.readyState>=2&&video.currentTime!==lastVideoTime){
    try{
      const r=landmarker.detectForVideo(video,now);
      const p=derive(r);
      if(p){
        chip(faceChip,'顔: 検出中','ok');
        applyFace(p,now);
      }else{
        chip(faceChip,'顔: 探しています','wait');
        if(now-lastStatusTime>500){
          statusEl.textContent='カメラ映像は取得できていますが、顔をまだ検出していません。正面から顔全体を入れてください。';
          lastStatusTime=now;
        }
      }
      lastVideoTime=video.currentTime;
    }catch(e){
      console.error(e);
      chip(faceChip,'顔: エラー','bad');
      statusEl.textContent='顔認識処理でエラーが発生しました。ページを再読み込みしてください。';
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
