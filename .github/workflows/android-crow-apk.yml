name: Build Crow Avatar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/crow-avatar/**"
      - ".github/workflows/android-crow-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Face Landmarker model into app assets
        working-directory: android/crow-avatar
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3             "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"             --output app/src/main/assets/face_landmarker.task
          test -s app/src/main/assets/face_landmarker.task

      - name: Build debug APK
        working-directory: android/crow-avatar
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crow-avatar-debug-apk
          path: android/crow-avatar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
